name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · lint · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund
      - name: Typecheck (app + e2e)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Domain + UI tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Generated styles are committed
        run: git diff --exit-code -- src/styles.css

  e2e:
    name: Browser smoke (desktop + mobile)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke suite
        run: npm run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
